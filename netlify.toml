[build]
  command = "npm run build"
  publish = "build/client"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite content-hashes everything under /assets — safe to cache forever, a new
# build gets new filenames. Without this Netlify defaults to max-age=0, so a
# browser cache evicted after a few idle days forces a full re-download.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
